version: "3.8"
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    # Dev compose: reload on, so file edits restart the worker. Do not use --reload
    # in production — it runs two processes, each with its own DB pool.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
