primary:
  provider: "openrouter"
  model: "nvidia/nemotron-nano-12b-v2-vl:free"
  temperature: 0.0
  max_retries: 2
  timeout_seconds: 60

fallback:
  provider: "openrouter"
  model: "nvidia/nemotron-nano-12b-v2-vl:free"
  temperature: 0.0
  max_retries: 1
  timeout_seconds: 90

retry_policy:
  wait_exponential_multiplier: 1
  wait_exponential_max: 10
  stop_after_attempt: 3
