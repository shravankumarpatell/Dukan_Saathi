primary:
  provider: "google"
  # Extraction / NLU. Shop chat analyst uses app.config GEMINI_MODEL.
  model: "gemini-3.5-flash-lite"
  temperature: 0.0
  max_retries: 2
  timeout_seconds: 30

fallback:
  provider: "google"
  # Alternate lite model if 3.5-flash-lite is unavailable.
  model: "gemini-3.1-flash-lite"
  temperature: 0.0
  max_retries: 1
  timeout_seconds: 60

retry_policy:
  wait_exponential_multiplier: 1
  wait_exponential_max: 10
  stop_after_attempt: 3
