primary:
  provider: "google"
  # Extraction / NLU. Shop chat analyst uses app.config GEMINI_MODEL.
  model: "gemini-3.6-flash"
  temperature: 0.0
  max_retries: 2
  timeout_seconds: 30

fallback:
  provider: "google"
  # Gemini 2.5/2.0 are closed to new Google AI Studio projects.
  model: "gemini-3.5-flash"
  temperature: 0.0
  max_retries: 1
  timeout_seconds: 60

retry_policy:
  wait_exponential_multiplier: 1
  wait_exponential_max: 10
  stop_after_attempt: 3
